[build]
  command = "npm run build"
  publish = "dist"

# VITE_API_BASE (the backend URL ending in /api) is set in the Netlify site's
# environment variables, not here - if it's missing the app falls back to
# localhost:8000 and every request fails.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
